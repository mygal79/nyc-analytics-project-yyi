name: 'nyc_analytics'
version: '1.0.0'
config-version: 2
# Some default settings for dbt
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
 - "target"
 - "dbt_packages"

# Set up models, which are basically SQL files, to create tables
models:
 nyc_analytics:
   +materialized: table

   assignment_work:
     staging:
       +materialized: table
       +schema: nyc_homework_staging

     marts:
       +materialized: table
       +schema: nyc_homework_warehouse_marts
      
       conformed:
         +materialized: table

       dob_job_filings:
         +materialized: table

       dot_311:
         +materialized: table

# Milestone 4 - Set up models, which are basically SQL files, to create tables

   project_work:
     staging:
       +materialized: table
       +schema: nyc_restaurant_data_analysis_staging

     marts:
       +materialized: table
       +schema: nyc_restaurant_data_analysis_warehouse_marts
      
       conformed:
         +materialized: table

       nyc_restaurant_inspection_primary:
         +materialized: table 

       nyc_restaurant_inspection_secondary_311:
         +materialized: table